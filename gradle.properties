# 工程位于中文路径（Windows）。AGP 默认拒绝，这里显式放行。
# file.encoding=GBK 使 Gradle 写出的 @argfile 与 JVM 本地编码（中文 Windows）一致；
# Kotlin 源码仍按 UTF-8 编译。
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=GBK
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.overridePathCheck=true
kotlin.code.style=official
